name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  checks:
    name: Project checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v9

      - name: Check lockfile
        run: uv lock --check

      - name: Ruff lint
        run: uvx --from ruff==0.16.2 ruff check .

      - name: Ruff format
        run: uvx --from ruff==0.16.2 ruff format --check .